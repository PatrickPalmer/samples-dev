[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-edge"
version = "1.0.0"
description = "Agentic AI assistant system optimized for edge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core AI/ML Framework
    "strands-agents @ git+https://github.com/westonbrown/sdk-python.git@main",
    # Configuration Management
    "python-dotenv>=1.0.0", # Environment variable management
    "pyyaml>=6.0.1", # YAML configuration support
    # Web & API Dependencies
    "requests>=2.31.0,<3.0.0", # HTTP client
    "httpx>=0.24.0,<1.0.0", # Modern async HTTP client
    "fastapi>=0.100.0,<1.0.0", # API framework
    "uvicorn[standard]>=0.23.0,<1.0.0", # ASGI server
    # AWS Integration
    "aws-requests-auth>=0.4.3,<0.5.0", # AWS request signing
    "boto3>=1.28.0,<2.0.0",             # AWS SDK for Bedrock
    # Data Processing & Validation
    "pydantic>=2.0.0,<3.0.0", # Data validation
    "numpy>=2.0.0,<3.0.0", # Numerical computing - updated for compatibility
    "orjson>=3.9.0,<4.0.0", # Fast JSON processing
    # Content Processing
    "markdownify>=0.11.0,<1.0.0", # HTML to Markdown conversion
    "readabilipy>=0.2.0,<1.0.0", # Web content extraction
    # Utilities
    "pytz>=2023.3", # Timezone support
    "psutil>=5.9.0,<8.0.0", # System monitoring - updated for compatibility
    "py-cpuinfo>=9.0.0,<10.0.0", # CPU information
    "sympy>=1.12.0,<2.0.0", # Symbolic mathematics
    # UI & Display
    "rich>=13.7.0,<14.0.0", # Rich terminal output
    "huggingface-hub[cli]>=0.34.4",
]

[project.optional-dependencies]
dev = [
    # Testing Framework
    "pytest>=8.0.0,<9.0.0",                 # Updated to latest stable
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.1.0,<6.0.0",             # More flexible version range
    "pytest-html>=3.2.0,<5.0.0",            # More flexible version range
    "pytest-xdist>=3.3.0,<4.0.0",
    "pytest-mock>=3.11.0,<4.0.0",
    "pytest-timeout>=2.1.0,<3.0.0",

    # Code Quality Tools
    "black>=24.0.0,<25.0.0",                # Updated to latest stable
    "ruff>=0.8.0,<1.0.0",                   # Updated to latest stable
    "mypy>=1.5.0,<2.0.0",
    "isort>=5.12.0,<6.0.0",
    
    # Documentation
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.0.0,<10.0.0",
]

audio = [
    "sounddevice>=0.4.6,<1.0.0",
    "soundfile>=0.12.0,<1.0.0",
    "scipy>=1.11.0,<2.0.0",  # For audio processing
]

edge = [
    # Production Optimizations
    "uvloop>=0.19.0,<1.0.0",        # Fast event loop
    "orjson>=3.9.0,<4.0.0",         # Fast JSON (duplicated for emphasis)
    # "pyopencl>=2023.1.0,<2024.0.0",  # GPU acceleration (optional)
]

ml = [
    # Machine Learning Extensions
    "faiss-cpu>=1.7.4,<2.0.0",              # Vector similarity search
    "sentence-transformers>=2.2.0,<4.0.0",  # Text embeddings (more flexible)
    "ipykernel>=6.0.0,<7.0.0",              # For Jupyter notebook support
    "scikit-learn>=1.3.0,<2.0.0",           # Machine learning utilities
    "pandas>=2.0.0,<3.0.0",                 # Data manipulation
]

asr = [
    # ASR Fine-tuning Dependencies
    "datasets>=2.18.0,<4.0.0",          # For Common Voice dataset loading
    "transformers>=4.53.0,<5.0.0",      # Whisper model support (flexible version)
    "accelerate>=1.0.0,<2.0.0",         # Training optimization (updated for compatibility)
    "evaluate>=0.4.1,<1.0.0",           # Metrics computation
    "jiwer>=3.0.3,<4.0.0",             # WER/CER calculation
    "peft>=0.12.0,<1.0.0",             # LoRA implementation (updated)
    "librosa>=0.10.1,<1.0.0",          # Audio processing
    "soundfile>=0.12.1,<1.0.0",        # Audio I/O (required for Common Voice)
    "audioread>=3.0.0",                 # Alternative audio decoder for MP3
    "pydub>=0.25.0",                    # Audio format conversion
    "tensorboard>=2.14.0",              # Training visualization
    "matplotlib>=3.7.0",                # Plotting results
    "torch>=2.8.0,<3.0.0",             # PyTorch (updated to latest stable)
    "torchaudio>=2.8.0,<3.0.0",        # Audio processing for PyTorch (aligned with torch)
]

function-calling = [
    # Function Calling Fine-tuning Dependencies for Qwen3
    # Note: These versions are tested to work together without conflicts
    "matplotlib>=3.7.0",
    "gguf>=0.7.0", # "gguf @ git+https://github.com/ggml-org/llama.cpp@b6210#subdirectory=gguf-py",
    "mistral-common>=1.8.3",
    "protobuf>=4.24.0",
    "torch>=2.8.0,<3.0.0",                  # PyTorch 2.8.x for latest stable CUDA support
    "torchvision>=0.23.0,<1.0.0",           # Vision library compatible with torch 2.8
    "transformers>=4.53.0,<5.0.0",          # HuggingFace transformers (flexible version)
    "datasets>=3.0.0,<4.0.0",               # HuggingFace datasets (more flexible)
    "accelerate>=1.0.0,<2.0.0",             # Training acceleration (updated for compatibility)
    "peft>=0.12.0,<1.0.0",                  # LoRA and parameter-efficient fine-tuning (updated)
    "boto3>=1.28.0,<2.0.0",                 # AWS SDK for Bedrock data generation
    "safetensors>=0.4.3,<1.0.0",            # Safe model serialization
    "sentencepiece>=0.2.0,<1.0.0",          # Tokenization for some models
    "triton>=3.0.0,<4.0.0",                 # GPU kernel compilation (explicit dependency)
    # Explicitly exclude problematic packages:
    # - torchao: causes operator registration conflicts
    # - unsloth: requires specific torch versions which may break compatibility
]

all = [
    # Install all optional dependencies
    "agentic-ai-edge[dev,audio,edge,ml,asr,function-calling]",
]

[project.scripts]
agentic-ai = "main:main"
agentic-ai-api = "main:run_api_server"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"*" = [
    "*.json",
    "*.yaml",
    "*.yml",
    "*.npy",
    "*.index",
    "data/vehicle_knowledge/data/*",
    "utils/*",
    "py.typed",  # PEP 561 type hints
]


[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "slow: Slow tests (>5 seconds)",
    "requires_model: Tests requiring AI model availability",
    "requires_audio: Tests requiring audio hardware",
    "requires_gpu: Tests requiring GPU acceleration",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
norecursedirs = [".git", ".tox", "dist", "build", "*.egg"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B905",  # zip() without an explicit strict= parameter
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests
"__init__.py" = ["F401"]  # Allow unused imports in __init__ files
