[pytest]
# Minimal pytest configuration for edge AI tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add src to Python path
pythonpath = . src

# Output settings
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes

# Test markers
markers =
    unit: Fast unit tests
    integration: Integration tests requiring services
    performance: Performance benchmarks
    slow: Tests taking > 5 seconds
    requires_llama: Requires llama.cpp server
    requires_bedrock: Requires AWS Bedrock